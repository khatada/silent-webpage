name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      upload_pages:
        description: Upload the tested build for GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, unit, build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run commit checks
        run: npm run verify
      - name: Use the official Ubuntu archive for browser dependencies
        run: |
          found_source=false
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              found_source=true
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          test "$found_source" = true
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser tests against the production build
        run: npm run test:e2e
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload the verified Pages build
        if: inputs.upload_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
